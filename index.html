<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lions District 325 F - Schooling Frame</title>
    <style>
        body { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; text-align: center; background: #f4f7f9; padding: 10px; margin: 0; overflow-x: hidden; }
        .container { max-width: 950px; margin: 20px auto; background: white; padding: 25px; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); border-top: 8px solid #00338d; }
        .header-box { margin-bottom: 20px; }
        .lions-intl { color: #00338d; font-size: 26px; font-weight: 800; text-transform: uppercase; margin-bottom: 5px; }
        .district-info { color: #b58d1d; font-size: 19px; font-weight: 700; margin-bottom: 10px; }
        .event-title { background: #00338d; color: white; padding: 10px 20px; border-radius: 50px; display: inline-block; font-size: 20px; font-weight: bold; box-shadow: 0 4px 10px rgba(0,51,141,0.3); }
        .ly-year { display: block; font-size: 15px; color: #ffeb3b; margin-top: 3px; font-weight: normal; }
        .frames-container { display: flex; flex-wrap: wrap; gap: 25px; justify-content: center; margin-top: 25px; }
        .frame-card { flex: 1; min-width: 320px; max-width: 420px; background: #fff; padding: 15px; border-radius: 15px; border: 1px solid #ddd; }
        .day-label { font-size: 20px; font-weight: 800; color: #00338d; margin-bottom: 10px; border-bottom: 2px solid #b58d1d; display: inline-block; padding-bottom: 3px; }
        .upload-section { background: #f8f9fa; border: 2px dashed #00338d; padding: 15px; border-radius: 15px; margin: 15px 0; }
        .instr { font-weight:bold; color:#00338d; display:block; margin-bottom:12px; font-size: 15px; line-height: 1.5; }
        input[type="file"] { background: white; padding: 8px; border-radius: 8px; border: 1px solid #ccc; font-size: 13px; width: 90%; cursor: pointer; }
        
        /* यहाँ touch-action: none राखियो ताकि स्क्रिन जुम नहोस् */
        canvas { width: 100%; height: auto; border: 2px solid #eee; border-radius: 10px; cursor: move; background: #f0f0f0; touch-action: none; margin: 15px 0; }
        
        .remove-btn { background: #dc3545; color: white; border: none; padding: 8px 15px; border-radius: 8px; cursor: pointer; font-size: 13px; display: none; margin-bottom: 10px; }
        .download-btn { width: 100%; padding: 14px; background: #28a745; color: white; border: none; border-radius: 12px; font-size: 17px; font-weight: 800; cursor: pointer; transition: 0.3s; text-transform: uppercase; }
        .footer { margin-top: 40px; border-top: 1px solid #eee; padding-top: 20px; font-size: 14px; color: #444; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-box">
        <div class="lions-intl">Lions International</div>
        <div class="district-info">District 325 F</div>
        <div class="event-title">Cabinet Schooling <span class="ly-year">LY 2026-2027</span></div>
    </div>

    <div class="frames-container">
        <div class="frame-card">
            <div class="day-label">For 2 Nights/3 Days</div>
            <div class="upload-section">
                <input type="file" class="img-input" data-id="1" accept="image/*">
            </div>
            <button class="remove-btn" id="remove1" data-id="1">फोटो हटाउनुहोस्</button>
            <canvas id="canvas1" width="2048" height="2048"></canvas>
            <button class="download-btn" data-id="1">फ्रेम डाउनलोड गर्नुहोस् (Day-1)</button>
        </div>

        <div class="frame-card">
            <div class="day-label">For 1 Night/ 2 Days</div>
            <div class="upload-section">
                <input type="file" class="img-input" data-id="2" accept="image/*">
            </div>
            <button class="remove-btn" id="remove2" data-id="2">फोटो हटाउनुहोस्</button>
            <canvas id="canvas2" width="2048" height="2048"></canvas>
            <button class="download-btn" data-id="2">फ्रेम डाउनलोड गर्नुहोस् (Day-2)</button>
        </div>
    </div>
</div>

<script>
    const frameImg1 = new Image(); frameImg1.src = 'day1.png?v=5'; 
    const frameImg2 = new Image(); frameImg2.src = 'day2.png?v=5';

    const frames = {
        1: { canvas: document.getElementById('canvas1'), ctx: document.getElementById('canvas1').getContext('2d'), userImg: new Image(), frameImg: frameImg1, hasPhoto: false, x: 0, y: 0, scale: 1, dragging: false, lastX: 0, lastY: 0, lastDist: 0 },
        2: { canvas: document.getElementById('canvas2'), ctx: document.getElementById('canvas2').getContext('2d'), userImg: new Image(), frameImg: frameImg2, hasPhoto: false, x: 0, y: 0, scale: 1, dragging: false, lastX: 0, lastY: 0, lastDist: 0 }
    };

    function draw(id) {
        const f = frames[id];
        f.ctx.clearRect(0, 0, f.canvas.width, f.canvas.height);
        if(f.hasPhoto) f.ctx.drawImage(f.userImg, f.x, f.y, f.userImg.width * f.scale, f.userImg.height * f.scale);
        f.ctx.drawImage(f.frameImg, 0, 0, f.canvas.width, f.canvas.height);
    }

    frameImg1.onload = () => draw(1);
    frameImg2.onload = () => draw(2);

    document.querySelectorAll('.img-input').forEach(input => {
        input.addEventListener('change', (e) => {
            const id = e.target.dataset.id;
            const f = frames[id];
            if (e.target.files && e.target.files[0]) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    f.userImg = new Image();
                    f.userImg.onload = () => {
                        f.hasPhoto = true;
                        const s = Math.max(f.canvas.width / f.userImg.width, f.canvas.height / f.userImg.height);
                        f.scale = s;
                        f.x = (f.canvas.width - f.userImg.width * s) / 2;
                        f.y = (f.canvas.height - f.userImg.height * s) / 2;
                        document.getElementById(`remove${id}`).style.display = 'inline-block';
                        draw(id);
                    };
                    f.userImg.src = event.target.result;
                };
                reader.readAsDataURL(e.target.files[0]);
            }
        });
    });

    [1, 2].forEach(id => {
        const f = frames[id];
        const canvas = f.canvas;

        // PC Zoom
        canvas.addEventListener('wheel', (e) => {
            if(!f.hasPhoto) return;
            e.preventDefault();
            f.scale -= e.deltaY * 0.001;
            draw(id);
        }, { passive: false });

        // Touch Zoom & Move (Fixed Screen Zoom Problem)
        canvas.addEventListener('touchstart', (e) => {
            if(!f.hasPhoto) return;
            if(e.touches.length === 1) {
                f.dragging = true;
                f.lastX = e.touches[0].clientX;
                f.lastY = e.touches[0].clientY;
            } else if(e.touches.length === 2) {
                f.dragging = false;
                f.lastDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
            }
        }, { passive: false });

        canvas.addEventListener('touchmove', (e) => {
            if(!f.hasPhoto) return;
            e.preventDefault(); // यसले स्क्रिन जुम हुन दिँदैन

            const rect = canvas.getBoundingClientRect();
            if(e.touches.length === 1 && f.dragging) {
                f.x += (e.touches[0].clientX - f.lastX) * (canvas.width / rect.width);
                f.y += (e.touches[0].clientY - f.lastY) * (canvas.height / rect.height);
                f.lastX = e.touches[0].clientX;
                f.lastY = e.touches[0].clientY;
            } else if(e.touches.length === 2) {
                const dist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
                f.scale *= (dist / f.lastDist);
                f.lastDist = dist;
            }
            draw(id);
        }, { passive: false });

        canvas.addEventListener('touchend', () => { f.dragging = false; });
    });

    document.querySelectorAll('.download-btn').forEach(btn => {
        btn.onclick = (e) => {
            const id = e.target.dataset.id;
            if(!frames[id].hasPhoto) { alert("फोटो छनोट गर्नुहोस्"); return; }
            const link = document.createElement('a');
            link.download = `Frame_Day${id}.png`;
            link.href = frames[id].canvas.toDataURL("image/png");
            link.click();
        };
    });
</script>
</body>
</html>
