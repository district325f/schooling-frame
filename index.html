<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <title>Lions District 325 F - Photo Frame</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; text-align: center; background: #f0f2f5; padding: 20px; }
        .container { max-width: 600px; margin: auto; background: white; padding: 25px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        h1 { color: #004a99; font-size: 24px; }
        #mainCanvas { width: 100%; max-width: 500px; height: auto; border: 2px solid #ddd; border-radius: 10px; cursor: move; margin: 20px auto; }
        .footer { margin-top: 30px; padding-top: 15px; border-top: 1px solid #ddd; font-size: 14px; color: #555; }
        a { color: #004a99; font-weight: bold; text-decoration: none; }
    </style>
</head>
<body>
<div class="container">
    <h1>Lions International</h1>
    <h3>District 325 F - Cabinet Schooling</h3>
    <input type="file" id="imageUpload" accept="image/*">
    <p>फोटोमा क्लिक गरी सार्नुहोस् वा माउस ह्विलले <b>Zoom In/Out</b> गर्नुहोस् ।</p>
    <canvas id="mainCanvas" width="2048" height="2048"></canvas>
    <button id="downloadBtn" style="padding:15px; width:100%; background:#28a745; color:white; border:none; border-radius:5px;">डाउनलोड गर्नुहोस्</button>
    
    <div class="footer">
        <p>Design by: <a href="https://www.facebook.com/nirajan.aryal.92" target="_blank">Nirajan Aryal</a></p>
        <p>Contact: 9851113811</p>
    </div>
</div>
<script src="script.js"></script>
</body>
</html>
