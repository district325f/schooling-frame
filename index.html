<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lions District 325 F - Schooling Frame</title>
    <style>
        body { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; text-align: center; background: #f4f7f9; padding: 10px; margin: 0; }
        .container { max-width: 900px; margin: 20px auto; background: white; padding: 25px; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); border-top: 8px solid #00338d; }
        
        .header-box { margin-bottom: 20px; }
        .lions-intl { color: #00338d; font-size: 26px; font-weight: 800; text-transform: uppercase; margin-bottom: 5px; }
        .district-info { color: #b58d1d; font-size: 19px; font-weight: 700; margin-bottom: 10px; }
        .event-title { background: #00338d; color: white; padding: 10px 20px; border-radius: 50px; display: inline-block; font-size: 20px; font-weight: bold; box-shadow: 0 4px 10px rgba(0,51,141,0.3); }
        .ly-year { display: block; font-size: 15px; color: #ffeb3b; margin-top: 3px; font-weight: normal; }

        /* दुईवटा फ्रेमलाई सँगै देखाउन */
        .frames-container { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; margin-top: 25px; }
        .frame-card { flex: 1; min-width: 320px; max-width: 400px; background: #fff; padding: 15px; border-radius: 15px; border: 1px solid #ddd; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .day-label { font-size: 20px; font-weight: 800; color: #00338d; margin-bottom: 10px; text-transform: uppercase; border-bottom: 2px solid #b58d1d; display: inline-block; }

        .upload-section { background: #f8f9fa; border: 2px dashed #00338d; padding: 15px; border-radius: 15px; margin: 15px 0; }
        .instr { font-weight:bold; color:#00338d; display:block; margin-bottom:12px; font-size: 15px; line-height: 1.5; word-break: keep-all; }

        input[type="file"] { background: white; padding: 8px; border-radius: 8px; border: 1px solid #ccc; font-size: 13px; width: 90%; cursor: pointer; }

        canvas { width: 100%; height: auto; border: 2px solid #eee; border-radius: 10px; cursor: move; background: #f0f0f0; touch-action: pan-x pan-y; margin: 15px 0; }
        
        .btn-group { display: flex; flex-direction: column; gap: 10px; }
        .remove-btn { background: #dc3545; color: white; border: none; padding: 8px; border-radius: 8px; cursor: pointer; font-size: 13px; display: none; }
        
        .download-btn { 
            width: 100%; padding: 14px; background: #28a745; color: white; border: none; border-radius: 12px; font-size: 17px; font-weight: 800; cursor: pointer; transition: 0.3s; text-transform: uppercase;
        }
        .download-btn:hover { background: #218838; }

        .footer { margin-top: 40px; border-top: 1px solid #eee; padding-top: 20px; font-size: 14px; color: #444; }
        .footer a { color: #00338d; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-box">
        <div class="lions-intl">Lions International</div>
        <div class="district-info">District 325 F</div>
        <div class="event-title">
            Cabinet Schooling
            <span class="ly-year">LY 2026-2027</span>
        </div>
    </div>

    <div class="frames-container">
        <div class="frame-card">
            <div class="day-label">Day-1</div>
            <div class="upload-section">
                <label class="instr">क्याबिनेट स्कुलिङ्गको लागी फेसबुक फ्रेम बनाउन कृपया आफ्नो फोटो छनोट गर्नुहोस्।</label>
                <input type="file" class="img-input" data-id="1" accept="image/*">
                <button class="remove-btn" data-id="1">फोटो हटाउनुहोस्</button>
            </div>
            <canvas id="canvas1" width="2048" height="2048"></canvas>
            <button class="download-btn" data-id="1">फ्रेम डाउनलोड गर्नुहोस् (Day-1)</button>
        </div>

        <div class="frame-card">
            <div class="day-label">Day-2</div>
            <div class="upload-section">
                <label class="instr">क्याबिनेट स्कुलिङ्गको लागी फेसबुक फ्रेम बनाउन कृपया आफ्नो फोटो छनोट गर्नुहोस् ।</label>
                <input type="file" class="img-input" data-id="2" accept="image/*">
                <button class="remove-btn" data-id="2">फोटो हटाउनुहोस्</button>
            </div>
            <canvas id="canvas2" width="2048" height="2048"></canvas>
            <button class="download-btn" data-id="2">फ्रेम डाउनलोड गर्नुहोस् (Day-2)</button>
        </div>
    </div>
    
    <div class="footer">
        Design by: <a href="https://www.facebook.com/nirajan.aryal.92" target="_blank">Nirajan Aryal</a>
        <div class="contact" style="font-weight: bold; color: #d9534f; margin-top: 5px;">Contact: 9851113811</div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
